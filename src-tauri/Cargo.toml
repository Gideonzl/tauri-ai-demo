[package]
name = "aiterminal"
version = "1.0.1"
description = "AITerminal - Remote SSH + AI Terminal"
authors = ["Rust Protocol Engineer"]
edition = "2021"

[lib]
name = "tauri_ai_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri2 core
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encryption: AES-256-GCM
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Pure Rust SSH (no C dependencies, works on all platforms)
russh = "0.44"
russh-keys = "0.44"

# Lazy statics + error type for russh
once_cell = "1.19"
anyhow = "1.0"
async-trait = "0.1"
# HTTP (AI API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Stream processing
futures = "0.3"
bytes = "1"

# PNG decoding for window icon
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging
log = "0.4"
tauri-plugin-http = "2.5.9"

[profile.release]
strip = true
lto = true
